<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫咪不容易 - 场景和事件演示</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        #gameCanvas {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .control-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
        }
        
        .control-panel h3 {
            margin-top: 0;
            color: #ffd700;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .status {
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.3s ease;
        }
        
        .log {
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .log-entry.info { color: #87ceeb; }
        .log-entry.success { color: #90ee90; }
        .log-entry.warning { color: #ffd700; }
        .log-entry.error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 猫咪不容易 - 场景和事件演示</h1>
        
        <div class="game-container">
            <canvas id="gameCanvas" width="1280" height="720"></canvas>
            
            <div class="controls">
                <div class="control-panel">
                    <h3>🎮 场景控制</h3>
                    <div class="button-group">
                        <button onclick="switchRoom('living_room_north')">客厅北向</button>
                        <button onclick="switchRoom('living_room_west_low')">客厅西向低处</button>
                        <button onclick="switchRoom('living_room_west_high')">客厅西向高处</button>
                        <button onclick="switchRoom('room_b')">主人房间</button>
                        <button onclick="switchRoom('hallway')">过道</button>
                    </div>
                </div>
                
                <div class="control-panel">
                    <h3>⚡ 动作执行</h3>
                    <div class="button-group">
                        <button onclick="executeAction('attack_cage')">攻击笼子</button>
                        <button onclick="executeAction('use_litter_box')">使用猫厕所</button>
                        <button onclick="executeAction('play_in_house')">在猫别墅玩耍</button>
                        <button onclick="executeAction('eat_fish_treat')">吃鱼干</button>
                        <button onclick="executeAction('play_with_mouse')">和玩具老鼠玩耍</button>
                        <button onclick="executeAction('destroy_screen')">破坏显示屏</button>
                        <button onclick="executeAction('sleep_on_bed')">在床上睡觉</button>
                    </div>
                </div>
                
                <div class="control-panel">
                    <h3>📊 游戏状态</h3>
                    <div class="status">
                        <div class="status-item">
                            <span>时间:</span>
                            <span id="currentTime">12:00</span>
                        </div>
                        <div class="status-item">
                            <span>饥饿值:</span>
                            <span id="hungerValue">5/10</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="hungerBar" style="width: 50%"></div>
                        </div>
                        <div class="status-item">
                            <span>精力值:</span>
                            <span id="energyValue">8/10</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="energyBar" style="width: 80%"></div>
                        </div>
                        <div class="status-item">
                            <span>当前房间:</span>
                            <span id="currentRoom">客厅北向</span>
                        </div>
                    </div>
                </div>
                
                <div class="control-panel">
                    <h3>🎯 成就系统</h3>
                    <div class="button-group">
                        <button onclick="checkAchievements()">检查成就</button>
                        <button onclick="resetGame()">重置游戏</button>
                    </div>
                    <div id="achievements" class="status">
                        暂无成就
                    </div>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>📝 事件日志</h3>
                <div id="eventLog" class="log"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SceneAndEventTest } from './src/test/SceneAndEventTest.js';
        
        // 全局变量
        let gameTest;
        let currentGameState = {
            currentTime: 12.0,
            hunger: 5,
            energy: 8,
            currentRoom: 'living_room_north',
            achievements: [],
            inventory: []
        };
        
        // 初始化
        window.addEventListener('load', () => {
            gameTest = new SceneAndEventTest();
            updateUI();
            log('游戏初始化完成', 'success');
        });
        
        // 场景切换
        window.switchRoom = (roomKey) => {
            const roomNames = {
                'living_room_north': '客厅北向',
                'living_room_west_low': '客厅西向低处',
                'living_room_west_high': '客厅西向高处',
                'room_b': '主人房间',
                'hallway': '过道'
            };
            
            currentGameState.currentRoom = roomKey;
            log(`切换到房间: ${roomNames[roomKey]}`, 'info');
            updateUI();
        };
        
        // 执行动作
        window.executeAction = (actionId) => {
            const actionNames = {
                'attack_cage': '攻击笼子',
                'use_litter_box': '使用猫厕所',
                'play_in_house': '在猫别墅玩耍',
                'eat_fish_treat': '吃鱼干',
                'play_with_mouse': '和玩具老鼠玩耍',
                'destroy_screen': '破坏显示屏',
                'sleep_on_bed': '在床上睡觉'
            };
            
            // 模拟动作效果
            switch(actionId) {
                case 'attack_cage':
                    currentGameState.energy -= 1;
                    log(`执行动作: ${actionNames[actionId]} - 精力-1`, 'success');
                    break;
                case 'use_litter_box':
                    currentGameState.hunger -= 1;
                    currentGameState.energy += 1;
                    log(`执行动作: ${actionNames[actionId]} - 饥饿-1, 精力+1`, 'success');
                    break;
                case 'play_in_house':
                    currentGameState.hunger -= 1;
                    log(`执行动作: ${actionNames[actionId]} - 饥饿-1`, 'success');
                    break;
                case 'eat_fish_treat':
                    currentGameState.hunger += 3;
                    log(`执行动作: ${actionNames[actionId]} - 饥饿+3`, 'success');
                    break;
                case 'play_with_mouse':
                    currentGameState.hunger -= 1;
                    log(`执行动作: ${actionNames[actionId]} - 饥饿-1`, 'success');
                    break;
                case 'destroy_screen':
                    currentGameState.hunger -= 1;
                    currentGameState.energy -= 3;
                    log(`执行动作: ${actionNames[actionId]} - 饥饿-1, 精力-3`, 'warning');
                    break;
                case 'sleep_on_bed':
                    currentGameState.energy += 3;
                    log(`执行动作: ${actionNames[actionId]} - 精力+3`, 'success');
                    break;
            }
            
            // 确保数值在合理范围内
            currentGameState.hunger = Math.max(0, Math.min(10, currentGameState.hunger));
            currentGameState.energy = Math.max(0, Math.min(10, currentGameState.energy));
            
            updateUI();
        };
        
        // 检查成就
        window.checkAchievements = () => {
            const achievements = [];
            
            if (currentGameState.hunger <= 2) {
                achievements.push('饥饿大师');
            }
            if (currentGameState.energy >= 8) {
                achievements.push('精力充沛');
            }
            if (currentGameState.currentRoom === 'room_b') {
                achievements.push('探索者');
            }
            
            currentGameState.achievements = achievements;
            log(`检查成就: ${achievements.length}个成就解锁`, 'info');
            updateUI();
        };
        
        // 重置游戏
        window.resetGame = () => {
            currentGameState = {
                currentTime: 12.0,
                hunger: 5,
                energy: 8,
                currentRoom: 'living_room_north',
                achievements: [],
                inventory: []
            };
            log('游戏已重置', 'info');
            updateUI();
        };
        
        // 更新UI
        function updateUI() {
            // 更新时间
            const hours = Math.floor(currentGameState.currentTime);
            const minutes = Math.floor((currentGameState.currentTime - hours) * 60);
            document.getElementById('currentTime').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            // 更新饥饿值
            document.getElementById('hungerValue').textContent = `${currentGameState.hunger}/10`;
            document.getElementById('hungerBar').style.width = `${currentGameState.hunger * 10}%`;
            
            // 更新精力值
            document.getElementById('energyValue').textContent = `${currentGameState.energy}/10`;
            document.getElementById('energyBar').style.width = `${currentGameState.energy * 10}%`;
            
            // 更新当前房间
            const roomNames = {
                'living_room_north': '客厅北向',
                'living_room_west_low': '客厅西向低处',
                'living_room_west_high': '客厅西向高处',
                'room_b': '主人房间',
                'hallway': '过道'
            };
            document.getElementById('currentRoom').textContent = roomNames[currentGameState.currentRoom];
            
            // 更新成就
            const achievementsDiv = document.getElementById('achievements');
            if (currentGameState.achievements.length > 0) {
                achievementsDiv.innerHTML = currentGameState.achievements.map(achievement => 
                    `<div style="color: #ffd700; margin-bottom: 5px;">🏆 ${achievement}</div>`
                ).join('');
            } else {
                achievementsDiv.innerHTML = '暂无成就';
            }
        }
        
        // 日志记录
        function log(message, type = 'info') {
            const logDiv = document.getElementById('eventLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
